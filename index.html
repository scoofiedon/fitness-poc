<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4d7c0f">

    <title>AI Тренер</title>
    <script type="module" crossorigin src="/fitness-poc/assets/index-BjrA4lnt.js"></script>
    <link rel="stylesheet" crossorigin href="/fitness-poc/assets/index-v4SkIU9e.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Single Page Apps for GitHub Pages
      // This script handles routing for GitHub Pages
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') + 
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))

      // Additional fallback for GitHub Pages
      function handleRouting() {
        const path = window.location.pathname;
        const basePath = '/fitness-poc/';
        
        // If path doesn't start with our base, redirect to base
        if (!path.startsWith(basePath)) {
          window.location.href = basePath;
        }
      }
      
      // Handle routing when page loads
      window.addEventListener('load', handleRouting);
    </script>
  </body>
</html>
