<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/fitness-poc/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4d7c0f">
    <link rel="manifest" href="/fitness-poc/manifest.json">
    <title>AI Тренер</title>
    <script type="module" crossorigin src="/fitness-poc/assets/index-BjrA4lnt.js"></script>
    <link rel="stylesheet" crossorigin href="/fitness-poc/assets/index-v4SkIU9e.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      // GitHub Pages fallback routing
      function handleRouting() {
        const path = window.location.pathname;
        const basePath = '/fitness-poc/';
        
        // If we're at the root, redirect to the app
        if (path === '/' || path === basePath) {
          window.location.href = basePath;
          return;
        }
        
        // For any other path, let Vue Router handle it
        if (path.startsWith(basePath)) {
          // The app will handle routing through Vue Router
          return;
        }
        
        // If path doesn't start with our base, redirect to base
        window.location.href = basePath;
      }
      
      // Handle routing when page loads
      window.addEventListener('load', handleRouting);
      
      // Handle browser back/forward buttons
      window.addEventListener('popstate', handleRouting);
    </script>
  </body>
</html>
